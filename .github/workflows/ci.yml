name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: canchaya_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/canchaya_ci
      TEST_DATABASE_URL: postgres://app_user:app_user_password@localhost:5432/canchaya_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      # Mismo patrón que producción: db/schema.sql corre como el rol
      # admin (dueño de las tablas), y los tests pegan como app_user —
      # el mismo rol sin ownership que hace que RLS se aplique de
      # verdad. Ver la nota sobre esto en db/schema.sql: si los tests
      # corrieran como el dueño de las tablas, no probarían nada real.
      - name: Set up test database
        run: |
          node -e "
            const fs = require('fs');
            const { Client } = require('pg');
            (async () => {
              const client = new Client({ connectionString: process.env.TEST_ADMIN_DATABASE_URL });
              await client.connect();
              await client.query(fs.readFileSync('db/schema.sql', 'utf8'));
              await client.query(\"create role app_user with login password 'app_user_password'\");
              await client.query('grant usage on schema public to app_user');
              await client.query('grant select, insert, update, delete on all tables in schema public to app_user');
              await client.query('alter default privileges in schema public grant select, insert, update, delete on tables to app_user');
              await client.end();
            })();
          "

      - run: npm test
